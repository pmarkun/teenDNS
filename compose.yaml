services:
  fixture:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    command: ["fixture", "-listen", ":5353", "-metrics", ":8080"]
    ports:
      - "127.0.0.1:18080:8080"
    networks:
      lab:
        ipv4_address: 10.77.53.10

  unbound:
    build:
      context: .
      dockerfile: docker/unbound.Dockerfile
    depends_on:
      - fixture
    networks:
      lab:
        ipv4_address: 10.77.53.20

  gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    command: ["gateway", "-config", "/runtime/gateway.json"]
    depends_on:
      - unbound
    ports:
      - "127.0.0.1:8853:853"
      - "127.0.0.1:18081:8081"
    environment:
      TEENDNS_ADMIN_TOKEN: teendns-lab
    user: "${TEENDNS_UID:-1000}:${TEENDNS_GID:-100}"
    volumes:
      - ./.local:/runtime
    networks:
      lab:
        ipv4_address: 10.77.53.30

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      - gateway
    ports:
      - "127.0.0.1:18082:8080"
    networks:
      lab:
        ipv4_address: 10.77.53.40

networks:
  lab:
    ipam:
      config:
        - subnet: 10.77.53.0/24
