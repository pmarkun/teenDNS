server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://gateway:8081;
    proxy_set_header Host $host;
  }

  location ^~ /dns-query/ {
    access_log off;
    client_max_body_size 64k;
    proxy_pass http://gateway:8081;
    proxy_set_header Host $host;
  }

  location /healthz {
    proxy_pass http://gateway:8081;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
